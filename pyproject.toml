[project]
name = "totem-cli"
version = "0.1.3"
description = "Assistente de terminal para preparar e administrar Totens Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "textual>=1.0,<9",
  "jinja2>=3.1.0",
  "paramiko>=3.4.0",
  "cryptography>=42.0.0",
  "passlib>=1.7.4",
]

[project.scripts]
totem = "totem_cli.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["totem_cli*"]

[tool.setuptools.package-data]
totem_cli = ["templates/*.j2", "templates/*.json", "templates/*.js", "assets/*"]
