name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip pytest .

      - name: Run tests
        run: python -m pytest

      - name: Check installed command entry point
        run: python -c "from importlib.metadata import entry_points; assert any(e.name == 'totem' for e in entry_points(group='console_scripts'))"
