name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binary-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build onefile binary
        run: |
          python -m pip install --upgrade pyinstaller .
          pyinstaller --onefile --console --noconfirm \
            --name totem-linux-amd64 \
            --add-data "totem_cli/templates:totem_cli/templates" \
            --add-data "totem_cli/assets:totem_cli/assets" \
            totem_cli/app.py
          test -s dist/totem-linux-amd64
          # Smoke: binary must boot the TUI and stay up (124 = still running).
          timeout 8 ./dist/totem-linux-amd64 < /dev/null > /dev/null 2>&1; test $? -eq 124

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: dist/totem-linux-amd64

  binary-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build onefile binary
        run: |
          python -m pip install --upgrade pyinstaller .
          pyinstaller --onefile --console --noconfirm `
            --name totem-windows-amd64 `
            --add-data "totem_cli/templates;totem_cli/templates" `
            --add-data "totem_cli/assets;totem_cli/assets" `
            totem_cli/app.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: dist/totem-windows-amd64.exe

  release:
    needs: [package, binary-linux, binary-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz totem-linux-amd64 totem-windows-amd64.exe > checksums.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
